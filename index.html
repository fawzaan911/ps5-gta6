<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title> PS5 و GTA 6</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <section class="showcase">
      <span class="tag">🎮 حملة تبرع</span>
      <h1 class="headline">
        ادعمني عشان أشتري
        <span class="grad">PS5 و GTA 6</span>
      </h1>

      <div class="products">
        <div class="product ps5"><img src="images/ps5.webp" alt="جهاز PlayStation 5" /></div>
        <div class="plus">+</div>
        <div class="product gta"><img src="images/gta6.webp" alt="لعبة GTA 6" /></div>
      </div>
    </section>

    <section class="card">
      <h2>تبرع الآن</h2>
      <div class="stats">
        <div>
          <small>تم جمع</small>
          <strong><span id="collected">0</span> ريال</strong>
        </div>
        <div class="goal">
          <small>الهدف</small>
          <strong><span id="goal">0</span> ريال</strong>
        </div>
      </div>
      <div class="progress"><div class="progress-bar" id="bar"></div></div>
      <div class="meta">
        <span><b id="percent">0%</b> مكتمل</span>
        <span>متبقي <span id="remaining">0</span> ريال</span>
      </div>

      <div class="amount-picker">
        <span class="picker-label">اختر مبلغ التبرع</span>
        <div class="presets" id="presets"></div>
        <label class="custom-amount">
          <span>أو اكتب مبلغ</span>
          <input type="number" id="custom-amount" inputmode="numeric" step="1" />
          <span>ريال</span>
        </label>
        <p class="amount-error" id="amount-error" hidden></p>
      </div>

      <a class="donate-btn" id="donate-btn" href="#">
        تبرع بـ <span id="btn-amount">10</span> ريال
      </a>
      <p class="methods">Apple Pay · مدى · فيزا · ماستركارد</p>

      <p class="secure">🔒 الدفع آمن ومشفّر عبر بوابة ميسر</p>
    </section>
  </div>

  <script src="config.js"></script>
  <script>
    const cfg = window.DONATION_CONFIG;
    const fmt = (n) => n.toLocaleString("ar-SA");

    function renderProgress(total) {
      const collected = Math.min(total, cfg.goalAmount);
      const percent = Math.round((collected / cfg.goalAmount) * 100);

      document.getElementById("collected").textContent = fmt(total);
      document.getElementById("remaining").textContent = fmt(cfg.goalAmount - collected);
      document.getElementById("percent").textContent = percent + "%";
      requestAnimationFrame(() => {
        document.getElementById("bar").style.width = Math.max(percent, 2) + "%";
      });
    }

    document.getElementById("goal").textContent = fmt(cfg.goalAmount);

    fetch(cfg.totalUrl, { cache: "no-store" })
      .then((res) => (res.ok ? res.json() : Promise.reject()))
      .then((data) => renderProgress(data.collected))
      .catch(() => renderProgress(cfg.collectedAmount));

    const presets = document.getElementById("presets");
    const customInput = document.getElementById("custom-amount");
    const errorEl = document.getElementById("amount-error");
    const donateBtn = document.getElementById("donate-btn");
    customInput.min = cfg.minAmount;
    customInput.max = cfg.maxAmount;
    customInput.placeholder = cfg.minAmount + " - " + cfg.maxAmount;

    function setAmount(amount) {
      const valid = Number.isInteger(amount) && amount >= cfg.minAmount && amount <= cfg.maxAmount;
      errorEl.hidden = valid;
      errorEl.textContent = "المبلغ لازم يكون رقم صحيح من " + fmt(cfg.minAmount) + " إلى " + fmt(cfg.maxAmount) + " ريال";
      donateBtn.classList.toggle("disabled", !valid);
      if (valid) {
        document.getElementById("btn-amount").textContent = fmt(amount);
        donateBtn.href = cfg.donateUrl + "?amount=" + amount;
      } else {
        donateBtn.removeAttribute("href");
      }
      presets.querySelectorAll("button").forEach((b) => {
        b.classList.toggle("active", Number(b.dataset.amount) === amount);
      });
    }

    cfg.presetAmounts.forEach((amount) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.amount = amount;
      btn.textContent = fmt(amount) + " ريال";
      btn.addEventListener("click", () => {
        customInput.value = "";
        setAmount(amount);
      });
      presets.appendChild(btn);
    });

    customInput.addEventListener("input", () => {
      if (customInput.value === "") return setAmount(cfg.defaultAmount);
      setAmount(Number(customInput.value));
    });

    setAmount(cfg.defaultAmount);
  </script>
</body>
</html>
