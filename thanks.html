<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شكراً لك</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="center-page">
    <main class="card result">
      <div class="icon" id="icon"></div>
      <h1 id="heading"></h1>
      <p id="message"></p>
      <a class="btn" href="index.html">الرجوع للصفحة الرئيسية</a>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get("status");
    const message = params.get("message");
    const id = params.get("id");

    const icon = document.getElementById("icon");
    const heading = document.getElementById("heading");
    const text = document.getElementById("message");

    if (status === "paid") {
      icon.textContent = "🤍";
      heading.textContent = "شكراً لأنك كنت موجود";
      text.textContent = "مساهمتك قرّبتني خطوة من السفر." + (id ? " رقم العملية: " + id : "");
    } else {
      icon.textContent = "❌";
      heading.textContent = "لم تتم عملية الدفع";
      text.textContent = message || "حدث خطأ أثناء الدفع، حاول مرة أخرى.";
    }
  </script>
</body>
</html>
